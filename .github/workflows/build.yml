name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Extrair e compilar
        run: |
          unzip -q *.zip
          cd ninjaclient
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'ninjaclient'
          EOF
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "ninjaclient",
            "version": "${version}",
            "name": "NinjaClient",
            "environment": "client",
            "accessWidener": "ninjaclient.accesswidener",
            "mixins": ["ninjaclient.mixins.json"],
            "entrypoints": { "client": ["com.meuclient.MeuClient"] },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF
          sed -i '/^jar {/,/^}/d' build.gradle
          find src -name '*.java' -exec sed -i \
            -e 's/cam\.getPos()/cam.getCameraPos()/g' \
            -e 's/\bp\.getPos()/p.getEntityPos()/g' \
            -e 's/golem\.getPos()/golem.getEntityPos()/g' \
            -e 's/target\.getPos()/target.getEntityPos()/g' {} +
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient
          path: ninjaclient/build/libs/*.jar
