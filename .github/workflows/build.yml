name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Extrair e compilar
        run: |
          unzip -q *.zip
          cd ninjaclient
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient
          path: ninjaclient/build/libs/*.jar
